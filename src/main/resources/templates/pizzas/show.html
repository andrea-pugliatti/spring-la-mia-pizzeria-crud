<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragments :: head(${pizza.name})}" />

<body>
    <div th:replace="~{fragments/header :: header('')}" />

    <main class="container d-flex justify-content-center">

        <div class="card text-center my-5">
            <div class="row g-0">
                <div class="col-md-8">
                    <img th:src="${pizza.image}" class="img-fluid rounded-start" alt="">
                </div>
                <div class="col-md-4" style="min-width: fit-content;">
                    <div class="card-body">
                        <h3 class="card-title">[[${pizza.name}]]</h3>
                        <p class="card-text">€[[${pizza.price}]]</p>
                        <p class="card-text">[[${pizza.description}]]</p>
                        <div>
                            <a class="btn btn-success btn-sm" th:href="@{/pizzas/edit/{id}(id = *{id})}">Modifica</a>
                            <form style="display: inline;" th:action="@{/pizzas/delete/{id}(id = *{id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm">Elimina</button>
                            </form>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/fragments :: bootstrap}" />
</body>

</html>
